<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Extension Settings</title>
    <!-- ✅ Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            width: 300px;
            padding: 15px;
        }

        .form-check-input {
            margin-left: 0;
        }

        .alert {
            padding: 6px 12px;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h5 class="mb-3">Nutritionix Settings</h5>

    <div class="mb-3">
        <label for="appId" class="form-label">App ID</label>
        <input type="text" class="form-control" id="appId" placeholder="Enter your App ID">
    </div>

    <div class="mb-3">
        <label for="apiKey" class="form-label">API Key</label>
        <input type="text" class="form-control" id="apiKey" placeholder="Enter your API Key">
    </div>

    <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="toggleExtension">
        <label class="form-check-label" for="toggleExtension">Enable Extension</label>
    </div>

    <button id="saveBtn" class="btn btn-primary w-100">Save Settings</button>

    <!-- ✅ Bootstrap Alert Placeholder -->
    <div id="alertBox" class="alert alert-success d-none" role="alert">
        ✅ Settings saved successfully!
    </div>

    <script src="popup.js"></script>
</body>

</html>
